[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-signal-analyzer"
version = "1.0.0"
description = "A local scientific workstation for exploring seismic waveform CSV data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "plotly>=5.18",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seismic-analyzer = "seismic_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
